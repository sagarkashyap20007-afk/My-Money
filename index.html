<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
header{display:flex;align-items:center;gap:12px;padding:12px 14px;max-width:560px;margin:0 auto}

.seg,.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.seg button{flex:1;padding:7px}.chips button{padding:6px 12px;font-size:13px}
.seg button.on,.chips button.on{background:var(--acc);color:#04222a;border-color:var(--acc);font-weight:700}
.ex{min-height:22px;margin-top:6px;font-size:16px;color:var(--acc);word-break:break-all;text-align:right}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.ic{width:42px;height:42px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.rec{align-items:center;gap:12px}.bsb{font-size:28px;padding:10px 18px}.ni{display:block;font-style:normal;font-size:22px;margin-bottom:2px}.ck{font-size:26px;color:var(--acc);flex:none}#fs{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 20px}#fs .fsb{display:none}.tap{cursor:pointer}.sum>div.tap{border-color:var(--acc)}.tip{display:none;position:absolute;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;pointer-events:none;min-width:110px}.tip i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}.fsb{position:absolute;right:8px;top:8px;padding:2px 10px;font-size:18px}.tb{display:flex;justify-content:space-between;margin-bottom:10px}.sel{font-size:16px;padding:14px 8px;text-align:center}#sh>div.full{height:100%;max-height:100%;border-radius:0}.bsb{touch-action:manipulation;user-select:none}.rg{display:flex;gap:2px;overflow-x:auto;margin:8px 0}.rg button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:18px}.rg button.on{background:var(--chip);color:var(--acc);font-weight:700}.kp button{padding:18px 0;font-size:28px}.kp .op{color:var(--acc);font-weight:700}.dots{padding:2px 10px;font-size:20px;background:none;border:0}.cal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.mc b{cursor:pointer}.mc small{display:block;font-size:11px;color:var(--mute);margin-bottom:4px}.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:11px;text-align:center}.dg span{padding:3px 0;border-radius:6px;cursor:pointer}.dg .h{color:var(--mute);cursor:default}.dg .has{box-shadow:inset 0 -2px var(--acc)}.dg .td{background:var(--acc);color:#04222a;font-weight:700}.dg .sl{outline:2px solid var(--int)}.leg{display:flex;gap:14px;font-size:12px;color:var(--mute)}.leg i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px}
.hb{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}.hb>span:first-child{width:120px}.hb>div{flex:1}.hb>span:last-child{width:70px;text-align:right}
.ins{margin-top:10px;font-size:14px;padding:10px;border-radius:10px;background:var(--chip)}
.ci{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
</style>
</head>

<script>
var D={acc:[],rec:[],loans:[]},sel=null,cy=0,ha=0,sm=0,pk={},VIDS=[],SH=190,FS=0,LC=null,AR=[],tab="r",open=null,rt="e",V={v:"nw",r:"1M",ty:"line",cat:"__e"},TT={r:"Records",k:"Calendar",h:"Account history",d:"Breakdown",a:"Accounts",l:"Loans",z:"Analysis",b:"Balance sheet",c:"Categories",x:"Export & backup"};
function p2(n){return n<10?"0"+n:""+n}
function dstr(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function today(){return dstr(new Date())}
var mo=today().slice(0,7);
try{D=JSON.parse(localStorage.getItem("owe2"))||D}catch(e){}
if(!D.acc.length&&!D.loans.length){try{var o1=JSON.parse(localStorage.getItem("owe1")||"[]");if(o1.length)D.loans=o1}catch(e){}}
if(!D.cat){D.cat={e:[["Food",0],["Snacks",1],["Cigarette",1],["Transport",0],["Bills",0],["Shopping",1],["Entertainment",1],["Health",0],["Loan EMI",0],["Other",0]].map(function(x){return{n:x[0],l:x[1]}}),i:["Salary","Trading","Other"].map(function(x){return{n:x}})}}
function save(){try{localStorage.setItem("owe2",JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function r2(n){return Math.round((+n||0)*100+(n<0?-1e-9:1e-9))/100}
function inr(n){n=r2(n);return (n<0?"-":"")+"₹"+Math.abs(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function sh(v){var a=Math.abs(v),s=a>=1e7?(a/1e7).toFixed(1)+"Cr":a>=1e5?(a/1e5).toFixed(1)+"L":a>=1e3?(a/1e3).toFixed(a>=1e4?0:1)+"k":Math.round(a)+"";return(v<0?"-":"")+s}
function esc(s){return String(s).replace(/</g,"&lt;")}
function acc(id){return D.acc.find(function(a){return a.id==id})}
function abal(a){var b=a.init;D.rec.forEach(function(r){if(r.acc==a.id)b+=r.t=="i"?r.amt:-r.amt;if(r.t=="t"&&r.to==a.id)b+=r.amt});return r2(b)}
function assets(){return r2(D.acc.reduce(function(s,a){return s+abal(a)},0))}
function owed(){return r2(D.loans.reduce(function(s,l){return s+l.bal},0))}
function isL(n){return D.cat.e.some(function(c){return c.n==n&&c.l})}
function curTh(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}
function theme(){D.theme=curTh()=="dark"?"light":"dark";document.documentElement.dataset.theme=D.theme;save();dc();render()}
if(D.theme)document.documentElement.dataset.theme=D.theme;
function dopen(){$("dw").style.display="block"}function dc(){$("dw").style.display="none"}
function go(t){if(t!="r")sm=0;tab=t;dc();render();scrollTo(0,0)}
function shut(){$("sh").style.display="none"}
function sheet(h){$("shb").className="";$("shb").innerHTML=h;$("sh").style.display="flex"}
function opts(list,sel){return list.map(function(a){return '<option value="'+a.id+'"'+(a.id==sel?" selected":"")+'>'+aico(a.name)+" "+esc(a.name)+" · "+inr(abal(a))+"</option>"}).join("")}
function copts(t){return D.cat[t].map(function(c){return'<option value="'+esc(c.n)+'">'+ico(c.n)+" "+esc(c.n)+"</option>"}).join("")}
function fab(){if(tab=="r")recForm();else if(tab=="a")accForm();else loanForm()}
function csv(rows){return rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n")}
function cpy(t){var done=function(){alert("Copied. Paste it into Notes, WhatsApp or email to keep it safe.")},fb=function(){var x=document.createElement("textarea");x.value=t;x.style.cssText="position:fixed;top:0;opacity:0";document.body.appendChild(x);x.focus();x.select();try{document.execCommand("copy");done()}catch(e){alert("Copy failed. Long-press the text box to copy.")}document.body.removeChild(x)};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}
function dlBox(fn,txt){window._df=fn;window._dt=txt;sheet('<h1>'+esc(fn)+'</h1><div class="row">Your file was downloaded. Look in your phone\'s <b>Downloads</b> folder. To keep a safe copy, send the file as a <b>document</b> (WhatsApp: paperclip, then Document).</div><div class="pay"><button class="p" onclick="shareF()">Share file</button><button onclick="shut()">Close</button></div><div class="row">File not there? <a href="#" onclick="dlText();return false" style="color:var(--ink)">Show text instead</a>'+(txt.length>100000?'. Large backups get cut off in WhatsApp and Notes, so prefer the file.':'')+'</div>')}
function shareF(){var fn=window._df,txt=window._dt;try{var f=new File([txt],fn,{type:fn.slice(-5)==".json"?"application/json":"text/csv"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:fn}).catch(function(){});return}}catch(e){}alert("Sharing is not available here. Open your Downloads folder, find "+fn+" and send it as a document.")}
function dlText(){var fn=window._df,txt=window._dt;sheet('<h1>'+esc(fn)+'</h1><div class="row">Only use this if the file did not save. Long text can get cut off when pasted into WhatsApp or Notes.</div><textarea id="dbx" readonly style="width:100%;height:160px;margin-top:8px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px"></textarea><div class="pay"><button class="p" id="dbc">Copy all</button><button onclick="shut()">Close</button></div>');$("dbx").value=txt;$("dbc").onclick=function(){cpy(txt)}}
function dl(fn,txt){
 var anchor=function(){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/octet-stream"}));a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){dlBox(fn,txt)},900)}catch(e){dlBox(fn,txt)}};
 var share=function(){try{var f=new File([txt],fn,{type:fn.slice(-5)==".json"?"application/json":"text/csv"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:fn}).catch(function(e){if(!e||e.name!="AbortError")anchor()});return}}catch(e){}anchor()};
 if(typeof claude!=="undefined"&&claude.use){claude.use("downloads").then(function(d){if(!d){share();return}d.save({filename:fn,data:txt}).catch(function(e){if(!e||e.code!="declined")alert("This file could not be saved here.")})}).catch(share)}else share()}
function accForm(){sheet('<h1>New account</h1><label>Name</label><input id="an" placeholder="Cash, Wallet, Savings"><label>Current balance (₹)</label><input id="ab" type="number" step="any" inputmode="decimal" value="0"><div class="pay"><button class="p" onclick="addAcc()">Save account</button><button onclick="shut()">Cancel</button></div>')}
function accMenu(id){var a=acc(id);sheet('<h1>'+esc(a.name)+'</h1><div class="pay"><button class="p" onclick="accEdit('+a.id+')">Edit</button></div><div class="pay"><button onclick="shut();delAcc('+a.id+')">Delete</button><button onclick="shut()">Close</button></div>')}
function accEdit(id){var a=acc(id);sheet('<h1>Edit account</h1><label>Name</label><input id="an" value="'+esc(a.name).replace(/"/g,"&quot;")+'"><label>Current balance (₹)</label><input id="ab" type="number" step="any" inputmode="decimal" value="'+abal(a)+'"><div class="row">Changing the balance adjusts the opening balance. Your records stay as they are.</div><div class="pay"><button class="p" onclick="saveAcc('+a.id+')">Save changes</button><button onclick="shut()">Cancel</button></div>')}
function saveAcc(id){var a=acc(id),n=$("an").value.trim(),v=$("ab").value;if(!n){alert("Enter an account name.");return}v=r2(+v||0);a.init=r2(a.init+(v-abal(a)));a.name=n;save();shut();render()}
function delAcc(id){var used=D.rec.some(function(r){return r.acc==id||r.to==id});if(used){alert("This account has records. Delete or move those records first.");return}if(confirm("Delete this account?")){D.acc=D.acc.filter(function(x){return x.id!=id});save();render()}}
function addAcc(){var n=$("an").value.trim();if(!n){alert("Enter an account name.");return}D.acc.push({id:Date.now(),name:n,init:r2(+$("ab").value||0)});save();shut();render()}
function recFormOld(eid){var E=eid?D.rec.find(function(x){return x.id==eid}):null;if(E)rt=E.t;
 if(!D.acc.length){alert("Add an account first.");go("a");return}
 sheet('<div class="seg" id="sg"><button onclick="setT(\'e\')">Expense</button><button onclick="setT(\'i\')">Income</button><button onclick="setT(\'t\')">Transfer</button></div><label>Amount (₹)</label><div class="pay" style="margin-top:0"><input id="ra" readonly inputmode="none" value="0" style="font-size:26px;text-align:right" aria-label="Amount"><button data-k="⌫" onclick="kk(this.dataset.k)" aria-label="Delete last digit">⌫</button></div><div id="ex" class="ex"></div>'+kpad()+'<label id="fl">Account</label><select id="rc">'+opts(D.acc)+'</select><div id="tw" style="display:none"><label>To account</label><select id="rd">'+opts(D.acc)+'</select></div><div id="cw"><label>Category</label><select id="rk"></select></div><label>Note</label><input id="rn"><label>Date</label><input id="rx" type="date" value="'+today()+'"><div class="pay"><button class="p" onclick="addRec('+(eid||0)+')">'+(E?"Update":"Save")+' record</button><button onclick="shut()">Cancel</button></div>');setT(rt);if(E){$("ra").value=E.amt;$("rc").value=E.acc;if(E.t=="t")$("rd").value=E.to;else $("rk").value=E.cat;$("rn").value=E.note;$("rx").value=E.date}}
function setTOld(t){rt=t;var b=$("sg").children;for(var i=0;i<3;i++)b[i].className="eit".charAt(i)==t?"on":"";$("tw").style.display=t=="t"?"block":"none";$("cw").style.display=t=="t"?"none":"block";$("fl").textContent=t=="t"?"From account":"Account";if(t!="t")$("rk").innerHTML=copts(t)}
function addRec(eid){var a=+ev($("ra").value);if(!(a>0)){alert("Enter an amount.");return}
 var r={id:eid||Date.now(),t:rt,amt:a,acc:+$("rc").value,to:+$("rd").value,cat:rt=="t"?"Transfer":$("rk").value,note:$("rn").value.trim(),date:$("rx").value||today(),time:$("rm").value||"00:00"};
 if(r.t=="t"&&r.acc==r.to){alert("Pick two different accounts.");return}
 D.last=D.last||{};D.last.acc=r.acc;if(r.t!="t")D.last[r.t]=r.cat;if(eid)D.rec=D.rec.map(function(x){return x.id==eid?r:x});else D.rec.push(r);mo=r.date.slice(0,7);sel=null;save();shut();render()}
function delRec(id){var r=D.rec.find(function(x){return x.id==id});
 if(!confirm("Delete this record"+(r.loan?" and undo the loan payment":"")+"?"))return;
 if(r.loan){var l=D.loans.find(function(x){return x.id==r.loan.id});if(l){l.bal=r2(l.bal+r.loan.p);l.pays=l.pays.filter(function(p){return p.rid!=id})}}
 D.rec=D.rec.filter(function(x){return x.id!=id});save();render()}
function kpad(){return '<div class="kp">'+["+","7","8","9","-","4","5","6","×","1","2","3","÷","0",".","="].map(function(k){return '<button class="'+("+-×÷=".indexOf(k)>=0?"op":"")+'" data-k="'+k+'" onclick="kk(this.dataset.k)">'+k+'</button>'}).join("")+'</div>'}
function kk(k){var i=$("ra"),v=i.value,op="+-×÷";
 if(k=="="){var r=ev(v);if(pr(v)!=v)$("ex").textContent=pr(v)+" = "+r;i.value=r;return}
 if(k=="⌫"){v=v.slice(0,-1);i.value=v||"0";upd();return}
